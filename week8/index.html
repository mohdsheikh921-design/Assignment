<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";
            gap: 20px;
            padding: 20px;
        }

        .grid-item {
            padding: 20px;
            border: 1px solid #ccc;
            text-align: center;
        }

        .head {
            grid-area: head;
        }

        .side {
            grid-area: side;
        }

        .main {
            grid-area: main;
        }

        .foot {
            grid-area: foot;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="grid-item head">Header</div>
        <div class="grid-item side">Sidebar</div>
        <div class="grid-item main">Main</div>
        <div class="grid-item foot">Footer</div>
    </div>
</body>
</html>
