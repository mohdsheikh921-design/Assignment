<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";
            gap: 20px;
            padding: 20px;
        }

        .grid-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            border: 1px solid #ccc;
            text-align: center;
        }

        .head {
            grid-area: head;
        }

        .side {
            grid-area: side;
        }

        .main {
            grid-area: main;
        }

        .foot {
            grid-area: foot;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="grid-item head">
            <span>⌂</span>
            <span>Header</span>
        </div>
        <div class="grid-item side">
            <span>☰</span>
            <span>Sidebar</span>
        </div>
        <div class="grid-item main">
            <span>▦</span>
            <span>Main</span>
        </div>
        <div class="grid-item foot">
            <span>ⓘ</span>
            <span>Footer</span>
        </div>
    </div>
</body>
</html>
