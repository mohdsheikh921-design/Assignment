<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #1f2937;
            background-color: #f8fafc;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            max-width: 72rem;
            min-height: 100vh;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
        }

        h1,
        h2,
        h3 {
            color: #111827;
            line-height: 1.2;
        }

        a {
            color: #4f46e5;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #818cf8;
            outline-offset: 3px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 40rem) {
            body {
                padding: 1.25rem;
            }
        }
    </style>
</head>
<body>

</body>
</html>
