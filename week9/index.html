<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <nav>
            <a class="logo" href="#">Logo</a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
                <button class="nav-button" type="button">Get Started</button>
            </div>
        </nav>

        <main class="banner">
            <h1>Welcome to Our Website</h1>
            <p>Discover our services and get started today.</p>
            <button class="banner-button" type="button">Explore Services</button>
        </main>
    </header>

    <section class="cards">
        <article class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
        </article>
        <article class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
        </article>
        <article class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
        </article>
    </section>

</html>
