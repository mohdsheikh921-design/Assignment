<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0ecff, #f7f9fc);
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
        }

        .logo {
            color: #111;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 18px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            color: #333;
            text-decoration: none;
        }

        .nav-button,
        .banner-button {
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        .nav-button {
            padding: 10px 18px;
        }

        .banner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 220px);
            padding: 40px 20px;
            text-align: center;
        }

        .banner h1 {
            margin: 0 0 16px;
            font-size: 2.25rem;
        }

        .banner p {
            max-width: 600px;
            margin: 0 0 24px;
            font-size: 1.125rem;
            color: #555;
        }

        .banner-button {
            padding: 12px 24px;
            font-size: 1rem;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 24px 20px;
        }

        .card {
            flex: 1 1 100%;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
        }

        @media (min-width: 768px) {
            nav {
                flex-direction: row;
                justify-content: space-between;
                padding-inline: 32px;
            }

            .nav-right {
                flex-direction: row;
                gap: 20px;
            }

            .nav-links {
                flex-wrap: nowrap;
                gap: 18px;
            }

            .banner {
                min-height: calc(100vh - 72px);
                padding-inline: 32px;
            }

            .banner h1 {
                font-size: 2.75rem;
            }

            .cards {
                padding: 32px;
            }

            .card {
                flex-basis: calc(50% - 10px);
            }
        }

        @media (min-width: 1024px) {
            nav {
                padding-inline: 40px;
            }

            .nav-right {
                gap: 24px;
            }

            .nav-links {
                gap: 24px;
            }

            .banner h1 {
                font-size: 3rem;
            }

            .cards {
                padding: 40px;
            }

            .card {
                flex-basis: 200px;
            }
        }
    </style>
</head>
<body>
    <header class="hero">
        <nav>
            <a class="logo" href="#">Logo</a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
                <button class="nav-button" type="button">Get Started</button>
            </div>
        </nav>

        <main class="banner">
            <h1>Welcome to Our Website</h1>
            <p>Discover our services and get started today.</p>
            <button class="banner-button" type="button">Explore Services</button>
        </main>
    </header>

    <section class="cards">
        <article class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
        </article>
        <article class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
        </article>
        <article class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
        </article>
    </section>
</body>
</html>
