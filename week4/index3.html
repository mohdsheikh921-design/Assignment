<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View upcoming events and register your interests.">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%228%22 y=%2212%22 width=%2248%22 height=%2244%22 rx=%226%22 fill=%22%234f46e5%22/%3E%3Cpath d=%22M8 24h48%22 stroke=%22white%22 stroke-width=%224%22/%3E%3Cpath d=%22M20 8v10m24-10v10%22 stroke=%22white%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
    <title>Upcoming Events</title>
</head>
<body>
    <h1>Upcoming Events</h1>
    <table>
        <thead>
            <tr>
                <th scope="col">Event</th>
                <th scope="col">Date</th>
                <th scope="col">Location</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Web Design Workshop</td>
                <td>November 10, 2026</td>
                <td>Community Hall</td>
            </tr>
            <tr>
                <td>Developer Meetup</td>
                <td>November 18, 2026</td>
                <td>Innovation Center</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">2 upcoming events</td>
            </tr>
        </tfoot>
    </table>
    <form>
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
        </div>
        <div>
            <label for="date">Date</label>
            <input type="date" id="date" name="date">
        </div>
        <div>
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <fieldset>
            <legend>Preferred contact method</legend>
            <div>
                <input type="radio" id="contact-email" name="contact-method" value="email">
                <label for="contact-email">Email</label>
            </div>
            <div>
                <input type="radio" id="contact-phone" name="contact-method" value="phone">
                <label for="contact-phone">Phone</label>
            </div>
        </fieldset>
        <fieldset>
            <legend>Interests</legend>
            <div>
                <input type="checkbox" id="interest-design" name="interests" value="design">
                <label for="interest-design">Design</label>
            </div>
            <div>
                <input type="checkbox" id="interest-development" name="interests" value="development">
                <label for="interest-development">Development</label>
            </div>
        </fieldset>
        <div>
            <label for="topic">Topic</label>
            <select id="topic" name="topic">
                <option value="">Select a topic</option>
                <option value="general">General</option>
                <option value="support">Support</option>
                <option value="feedback">Feedback</option>
            </select>
        </div>
        <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" cols="40"></textarea>
        </div>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
