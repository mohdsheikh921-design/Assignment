<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background-color: white;
        }

        .logo {
            color: #111;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            color: #333;
            text-decoration: none;
        }

        .nav-button {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        .banner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 64px);
            text-align: center;
        }
    </style>
</head>
<body>
    <nav>
        <a class="logo" href="#">Logo</a>

        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <button class="nav-button" type="button">Get Started</button>
        </div>
    </nav>

    <main class="banner">
        <h1>Welcome to Our Website</h1>
        <p>Discover our services and get started today.</p>
    </main>
</body>
</html>
