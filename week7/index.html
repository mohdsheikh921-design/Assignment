<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0ecff, #f7f9fc);
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
        }

        .logo {
            color: #111;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            color: #333;
            text-decoration: none;
        }

        .nav-button {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        .banner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 72px);
            text-align: center;
        }

        .banner h1 {
            margin: 0 0 16px;
            font-size: 48px;
        }

        .banner p {
            max-width: 600px;
            margin: 0 0 24px;
            font-size: 18px;
            color: #555;
        }

        .banner-button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 40px;
        }

        .card {
            flex: 1 1 200px;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
        }
    </style>
</head>
<body>
    <header class="hero">
        <nav>
            <a class="logo" href="#">Logo</a>

            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
                <button class="nav-button" type="button">Get Started</button>
            </div>
        </nav>

        <main class="banner">
            <h1>Welcome to Our Website</h1>
            <p>Discover our services and get started today.</p>
            <button class="banner-button" type="button">Explore Services</button>
        </main>
    </header>

    <section class="cards">
        <article class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
        </article>
        <article class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
        </article>
        <article class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
        </article>
    </section>
</body>
</html>
